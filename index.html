<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF-DEV – Minecraft Mod Studio</title>
<meta name="description" content="BF-DEV is a Minecraft mod studio. Browse our mods and follow us on socials.">
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #000000;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --line: #262626;
    --card: #111111;
    --glow: rgba(255,255,255,.08);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* animated background */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px);
    background: var(--glow); width: 46vw; height: 46vw;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .blob.b1 { top: -15vw; left: -10vw; }
  .blob.b2 { bottom: -20vw; right: -10vw; animation-duration: 24s; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(8vw,6vw) scale(1.25); }
  }
  .spot {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(500px circle at var(--mx,50%) var(--my,30%), var(--glow), transparent 70%);
  }

  /* header / socials */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 24px;
    max-width: 1100px; width: 100%; margin: 0 auto;
  }
  .social {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1.5px solid var(--fg); border-radius: 50%;
    opacity: 0; transform: translateY(-14px) scale(.8);
    animation: pop .6s var(--ease) forwards;
    transition: background .2s, color .2s, transform .25s var(--ease);
  }
  .social:nth-child(1) { animation-delay: .1s; }
  .social:nth-child(2) { animation-delay: .2s; }
  .social:nth-child(3) { animation-delay: .3s; }
  .social svg { width: 20px; height: 20px; fill: currentColor; }
  .social:hover { background: var(--fg); color: var(--bg); transform: translateY(-4px) rotate(-8deg) scale(1.1); animation: none; opacity: 1; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .btn {
    display: inline-block; padding: 10px 22px;
    border: 1.5px solid var(--fg); border-radius: 999px;
    font-weight: 600; font-size: .95rem;
    position: relative; overflow: hidden; isolation: isolate;
    transition: color .25s, transform .25s var(--ease);
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--fg); transform: translateY(101%);
    transition: transform .3s var(--ease);
  }
  .btn:hover { color: var(--bg); transform: translateY(-2px); }
  .btn:hover::before { transform: none; }
  .btn.solid { color: var(--bg); }
  .btn.solid::before { transform: none; }
  .btn.solid:hover { color: var(--fg); }
  .btn.solid:hover::before { transform: translateY(-101%); }

  /* hero */
  .hero { text-align: center; padding: 40px 24px 80px; max-width: 760px; margin: 0 auto; }
  .logo-wrap { perspective: 900px; display: inline-block; width: min(520px, 92%); }
  .hero img {
    width: 100%; height: auto; display: block;
    opacity: 0; transform: scale(.85);
    animation: logoIn 1s var(--ease) .2s forwards, float 6s ease-in-out 1.4s infinite;
    transition: transform .15s ease-out;
    will-change: transform;
    filter: drop-shadow(0 0 18px rgba(255,255,255,.25));
  }
  @keyframes logoIn { to { opacity: 1; transform: none; } }
  @keyframes float { 50% { translate: 0 -10px; } }
  .hero p {
    color: var(--muted); font-size: 1.15rem; margin-top: 8px;
    opacity: 0; animation: rise .8s var(--ease) .8s forwards;
  }
  .scroll-hint {
    display: block; margin: 36px auto 0; width: 22px; height: 36px;
    border: 1.5px solid var(--muted); border-radius: 12px; position: relative;
    opacity: 0; animation: rise .8s var(--ease) 1.1s forwards;
  }
  .scroll-hint::after {
    content: ""; position: absolute; left: 50%; top: 6px; width: 3px; height: 7px;
    margin-left: -1.5px; border-radius: 2px; background: var(--muted);
    animation: wheel 1.6s ease-in-out infinite;
  }
  @keyframes wheel { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(12px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* sections */
  main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 24px 60px; }
  .reveal { opacity: 0; transform: translateY(32px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap; position: relative;
    padding-top: 28px; margin-bottom: 24px;
  }
  .section-head::before {
    content: ""; position: absolute; top: 0; left: 0; height: 2px; width: 100%;
    background: var(--fg); transform: scaleX(0); transform-origin: left;
    transition: transform 1.1s var(--ease);
  }
  .section-head.in::before { transform: scaleX(1); }
  h2 { font-size: 1.7rem; letter-spacing: -.02em; }
  .section-head a { color: var(--muted); font-size: .95rem; transition: color .2s, letter-spacing .25s; }
  .section-head a:hover { color: var(--fg); letter-spacing: .03em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 12px; padding: 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    position: relative; overflow: hidden;
    opacity: 0; transform: translateY(28px);
    transition: opacity .7s var(--ease), transform .25s var(--ease), border-color .2s, box-shadow .25s;
    transition-delay: calc(var(--i, 0) * 90ms), 0s, 0s, 0s;
  }
  .card.in { opacity: 1; transform: none; }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(220px circle at var(--cx,50%) var(--cy,50%), var(--glow), transparent 70%);
    transition: opacity .25s;
  }
  .card:hover { border-color: var(--fg); box-shadow: 0 14px 34px -14px rgba(0,0,0,.35); transition-delay: 0s; }
  .card:hover::after { opacity: 1; }
  .card-top { display: flex; gap: 14px; align-items: center; }
  .icon {
    width: 56px; height: 56px; flex: none; border-radius: 12px;
    background: var(--line); object-fit: cover; transition: transform .35s var(--ease);
  }
  .card:hover .icon { transform: rotate(-6deg) scale(1.08); }
  .card h3 { font-size: 1.05rem; }
  .card .type { font-size: .8rem; color: var(--muted); text-transform: capitalize; }
  .card p { color: var(--muted); font-size: .92rem; flex: 1; }
  .card .dl { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; }
  .card .dl span:last-child { transition: transform .25s var(--ease); }
  .card:hover .dl span:last-child { transform: translateX(5px); }
  .status { color: var(--muted); padding: 20px 0; }

  footer { text-align: center; padding: 28px 24px; color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .social, .hero img, .hero p, .scroll-hint, .reveal, .card { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="spot"></div>

<header>
  <a class="social" href="https://discord.gg/tCMnj3QNMs" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
    <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 -.2 13.5.2 18a20 20 0 0 0 6 3l1.3-2.1a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4a13 13 0 0 1-2 1l1.3 2.1a20 20 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.6ZM8.7 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Zm6.6 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Z"/></svg>
  </a>
  <a class="social" href="https://tiktok.com/@bfdev_mc" target="_blank" rel="noopener" aria-label="TikTok" title="TikTok">
    <svg viewBox="0 0 24 24"><path d="M19.6 6.8a4.8 4.8 0 0 1-3-1.6A4.8 4.8 0 0 1 15.5 2h-3.3v13.4a2.9 2.9 0 1 1-2-2.8V9.2a6.2 6.2 0 1 0 5.3 6.2V9a8 8 0 0 0 4.6 1.5V7.2a4.8 4.8 0 0 1-.5-.4Z"/></svg>
  </a>
  <a class="social" href="https://twitter.com/bfdev_mc" target="_blank" rel="noopener" aria-label="X / Twitter" title="X / Twitter">
    <svg viewBox="0 0 24 24"><path d="M18.2 2.3h3.3l-7.2 8.3 8.5 11.2h-6.6l-5.2-6.8-5.9 6.8H1.800l7.700-8.900L1.400 2.300h6.800l4.700 6.200 5.300-6.200Zm-1.200 17.500h1.800L7 4.100H5.100l11.900 15.700Z"/></svg>
  </a>
</header>

<section class="hero">
  <div class="logo-wrap" id="logoWrap"><img id="logo" src="logo.png" alt="BF-DEV logo"></div>
  <p>A Minecraft mod studio.</p>
  <span class="scroll-hint" aria-hidden="true"></span>
</section>

<main>
  <div class="section-head reveal">
    <h2>Our Mods</h2>
    <a href="https://modrinth.com/organization/bf-dev" target="_blank" rel="noopener">View all on Modrinth →</a>
  </div>
  <div id="mods" class="grid"></div>
  <p id="status" class="status">Loading mods…</p>
  <p class="reveal" style="margin-top:28px">
    <a class="btn solid" href="https://modrinth.com/organization/bf-dev" target="_blank" rel="noopener">Our Modrinth profile</a>
  </p>
</main>

<footer>© <span id="year"></span> BF-DEV</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const grid = document.getElementById('mods');
  const status = document.getElementById('status');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // scroll reveal
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: .15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  // section-head underline also uses .in via .reveal

  // cursor spotlight
  addEventListener('pointermove', e => {
    document.documentElement.style.setProperty('--mx', e.clientX + 'px');
    document.documentElement.style.setProperty('--my', e.clientY + 'px');
  });

  // logo 3D tilt
  const wrap = document.getElementById('logoWrap'), logo = document.getElementById('logo');
  wrap.addEventListener('pointermove', e => {
    const r = wrap.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    logo.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) scale(1.04)`;
  });
  wrap.addEventListener('pointerleave', () => logo.style.transform = '');

  fetch('https://api.modrinth.com/v3/organization/bf-dev/projects')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(projects => {
      projects = projects.filter(p => p.status === 'approved' || !p.status)
                         .sort((a, b) => b.downloads - a.downloads);
      if (!projects.length) { status.textContent = 'No mods yet – check back soon!'; return; }
      status.remove();
      grid.innerHTML = projects.map((p, i) => {
        const type = (p.project_types && p.project_types[0]) || 'project';
        const url = `https://modrinth.com/${type}/${p.slug}`;
        return `
        <a class="card" style="--i:${i}" href="${esc(url)}" target="_blank" rel="noopener">
          <div class="card-top">
            ${p.icon_url ? `<img class="icon" src="${esc(p.icon_url)}" alt="" loading="lazy">` : `<div class="icon"></div>`}
            <div><h3>${esc(p.name)}</h3><div class="type">${esc(type)}</div></div>
          </div>
          <p>${esc(p.summary)}</p>
          <div class="dl"><span>${Number(p.downloads).toLocaleString('en-US')} downloads</span><span>→</span></div>
        </a>`;
      }).join('');
      grid.querySelectorAll('.card').forEach(c => {
        io.observe(c);
        c.addEventListener('pointermove', e => {
          const r = c.getBoundingClientRect();
          c.style.setProperty('--cx', e.clientX - r.left + 'px');
          c.style.setProperty('--cy', e.clientY - r.top + 'px');
        });
      });
    })
    .catch(() => {
      status.innerHTML = 'Couldn\'t load the mod list. <a href="https://modrinth.com/organization/bf-dev" target="_blank" rel="noopener" style="text-decoration:underline">See our mods on Modrinth</a>.';
    });
</script>
</body>
</html>
